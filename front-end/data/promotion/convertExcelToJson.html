<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Promotion Tool</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 800px; margin: auto; }
    input, textarea, select {
      width: 100%;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 16px;
      margin-right: 10px;
    }
    .preview {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 20px;
    }
    img {
      max-width: 200px;
      margin-top: 10px;
    }
    .ouputJson {
        min-height: 30vh;
    }
    .longContentStyle {
        min-height: 30vh;
    }
  </style>
</head>
<body>

<h2>Promotion Input Tool</h2>
<input type="file" id="excelFile" accept=".xlsx, .xls" />
<button onclick="handleImport()">Import Excel</button>
<button onclick="copyJSON()">Copy JSON</button>
<button onclick="downloadJSON()">Download JSON</button>
<br><br>

<div class="preview">
  <h3>Preview long text</h3>
  <div id="listPreview"></div>
</div>

<h3>Output JSON</h3>
<textarea id="output" class="ouputJson" placeholder="Output JSON will appear here..."></textarea>

<script>
let imageName = "";
let promotionList = [];

function normalizePromoId(rawId) {
  if (!rawId) return "";
  const str = String(rawId).trim();
  const match = str.match(/^(?:promo-)?(\d+)$/i);
  if (match) {
    return `promo-${match[1].padStart(3, "0")}`;
  }
  return str.startsWith("promo-") ? str : `promo-${str}`;
}

function normalizeThumbnail(rawImage, promoId) {
  const img = (rawImage || promoId || "default.png").trim();
  if (/\.(png|jpe?g|webp|svg)$/i.test(img)) {
    return `./assets/${img}`;
  }
  return `./assets/${img}.png`;
}

function handleImport() {
  const fileInput = document.getElementById("excelFile");
  const file = fileInput.files[0];

  if (!file) {
    alert("Chọn file Excel trước");
    return;
  }

  const reader = new FileReader();

  reader.onload = function (e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: "array" });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet);

    promotionList = []; // reset

    rows.forEach((row, index) => {
      // Find row keys trimmed
      const getVal = (key) => {
        for (const k of Object.keys(row)) {
          if (k.trim().toLowerCase() === key.toLowerCase()) return row[k];
        }
        return "";
      };

      const title = getVal("title") || row.title || "";
      const shortContent = getVal("shortContent") || row.shortContent || "";
      const longContent = getVal("longContent") || row.longContent || "";
      const rawImage = getVal("image") || row.image || "";
      const timeVal = getVal("time") || row.time || "";
      const cardType = getVal("cardType") || row.cardType || "";
      const code = getVal("code") || row.code || "";

      const promoId = normalizePromoId(rawImage || `promo-${index + 1}`);
      const longHTML = convertToHTML(longContent);

      const item = {
        id: promoId,
        promotionGroup: "HDB",
        promotionCate: cardType ? cardType.replace(/\s+/g, "") : "",
        promotionCode: code || "",
        name: title,
        thumbnail: normalizeThumbnail(rawImage, promoId),
        shortDesc: formatBold(shortContent),
        longDesc: longHTML,
        startDate: row.startDate || new Date().toISOString(),
        endDate: row.endDate || new Date().toISOString(),
        createdDate: new Date().toISOString(),
        updatedDate: new Date().toISOString(),
        isHotDeal: false,
        extraData: timeVal
      };

      promotionList.push(item);
    });

    // 👉 show JSON
    document.getElementById("output").value = JSON.stringify(promotionList, null, 2);

    // 👉 render preview
    renderPreviewList(promotionList);
  };

  reader.readAsArrayBuffer(file);
}

// upload image safely guarded
const imageInputEl = document.getElementById("imageInput");
if (imageInputEl) {
  imageInputEl.addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (file) {
      imageName = file.name;
    }
  });
}

function formatBold(text) {
  return String(text || "").replace(/(\d+%)/g, "<strong>$1</strong>");
}

// convert text -> html
function convertToHTML(text) {
  if (!text) return "";
  const lines = String(text).split("\n");
  let html = "";
  let inList = false;

  lines.forEach(line => {
    line = line.trim();
    if (!line) return;

    if (/^\d+\./.test(line)) {
      if (inList) {
        html += "</ul>";
        inList = false;
      }
      html += `<p><strong>${line}</strong></p>`;
    } else if (line.startsWith("-")) {
      if (!inList) {
        html += "<ul>";
        inList = true;
      }
      html += `<li>${line.substring(1).trim()}</li>`;
    } else {
      html += `<p>${line}</p>`;
    }
  });

  if (inList) html += "</ul>";
  return html;
}

function renderPreviewList(list) {
  const container = document.getElementById("listPreview");
  container.innerHTML = list.map(item => `
    <div style="border:1px solid #ccc; padding:10px; margin-bottom:10px">
      <h4>${item.name} (${item.id})</h4>
      <p><b>${item.promotionCode}</b> | <i>${item.promotionCate}</i></p>
      <p>${item.shortDesc}</p>
      <div>${item.longDesc}</div>
      <p><i>${item.extraData}</i></p>
    </div>
  `).join("");
}

// copy
function copyJSON() {
  const output = document.getElementById("output");
  if (!output.value) {
    alert("Không có nội dung JSON để sao chép!");
    return;
  }
  output.select();
  navigator.clipboard.writeText(output.value).then(() => {
    alert("Đã sao chép JSON vào clipboard!");
  }).catch(() => {
    document.execCommand("copy");
    alert("Đã sao chép JSON!");
  });
}

// download file
function downloadJSON() {
  const dataStr = document.getElementById("output").value;
  if (!dataStr) {
    alert("Không có nội dung JSON để tải!");
    return;
  }
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "promotion-list.json";
  a.click();
  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
