<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>VNeID CVP</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            overflow-x: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            background-image: url('./assets/background.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            min-height: 100vh;
        }

        .cell {
            width: 100%;
        }

        .section {
            margin: 0px auto 0px auto;
            width: 100%;
        }

        .row {
            display: flex;
            justify-content: center;
            align-items: stretch;
            flex-wrap: nowrap;
            padding: 0px;
        }

        .menu-container {
            padding-bottom: 5vh;
            position: relative;
            top: -3vh; 
            padding-right: 3vw;
            padding-left: 3vw;
        }

        @media screen and (min-height: 950px) {
            .menu-container {
                top: -5vh;
            }
        }
    </style>
</head>

<body id="body">
    <div class="row">
        <div class="cell ">
            <img src="./assets/hero_image_vi.png" class="section" />
        </div>
    </div>

    <div class="row menu-container">
        <div class="cell">
            <img src="./assets/menu_vi.png" class="section" />
        </div>
    </div>
</body>

</html>
