<html lang='vi'>
  <head>
    <meta charset='UTF-8' />
    <title></title>
    <meta charset='utf-8' />
    <meta http-equiv='X-UA-Compatible' content='IE=edge' />
    <meta name='description' content='' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <link rel='preconnect' href='https://fonts.googleapis.com' />
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin />
    <link
      href='https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700&display=swap'
      rel='stylesheet'
    />
    <style>
      body {
        font-family: 'Be Vietnam Pro', sans-serif;
        padding: 0;
        margin: 0;
      }
      /* overlay */
      .popup-overlay {
        position: fixed;
        inset: 0;
        background: rgba(246, 247, 248, 1);
        z-index: 99999;
        bottom: 0;
        display: none;
      }

      .popup-overlay.show {
        display: block;
      }

      .popup-content {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
      }

      .popup-body {
        height: 100%;
        overflow-y: auto;
        background: rgba(246, 247, 248, 1);
      }
      .promo-detail {
        padding-bottom: 50px;
      }
      .popup-close {
        position: fixed;
        right: 0;
        font-size: 28px;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 2147483647;
        top: 0;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .popup-close img {
        display: block;
        width: 30px;
        height: 30px;
      }
      .popup-iframe {
        width: 100%;
        height: 100%;
        border: none;
        min-height: 70vh;
        background: #fff;
      }
      .popup-inner {
        padding: 20px 10px;
      }

      /* IMAGE */
      .promo-image {
        position: relative;
        padding-bottom: 67%;
        height: 0;
      }

      .promo-image img {
        width: 100%;
        display: block;
        object-fit: cover;
        position: absolute;
        height: 100%;
      }

      /* AVATAR / BADGE */
      .promo-avatar {
        position: absolute;
        right: 16px;
        bottom: -20px;
        width: 40px;
        height: 40px;
        background: #0f766e; /* xanh kiểu Mantine */
        color: #fff;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        border: 3px solid #fff;
      }

      /* CONTENT */
      .promo-content {
        padding: 28px 10px 20px;
      }

      .promo-title {
        font-size: 14px;
        font-weight: 700;
        color: #111827;
        line-height: 1.3;
        margin: 0 0 10px;
      }

      .promo-desc {
        font-size: 13px;

        color: rgba(15, 21, 36, 0.6);
        line-height: 1.6;
        margin: 0 0 12px;
      }

      .promo-expire {
        font-size: 13px;
        color: rgba(15, 21, 36, 0.36);
        margin: 0;
        position: absolute;
        bottom: 16px;
      }

      #promo-list {
        border: 1px solid rgba(0, 0, 0, 0.08);
        padding: 8px;
        margin: 0;
        margin-bottom: 120px;
        display: flex;
        flex-direction: column;
      }

      .promo-card {
        background: #fff;
        overflow: hidden;
        margin-bottom: 10px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        position: relative;
        padding-bottom: 40px;
        border-radius: 16px;
      }
      .promo-card:nth-child(2n) {
        border-left: 1px solid rgba(0, 0, 0, 0.08);
      }

      .popup-title {
        background: none;
        font-size: 36px;
        padding: 0px 16px;
        margin-top: 40px;
        font-weight: 600;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body class='hasTopSpace' id='body'>

    <style>
  .promo-desc {
    padding-top: 10px;
    color: rgba(0, 0, 0, 1);
    font-weight: 400;
  }
  .promo-title {
    font-size: 32px;
    font-weight: 600;
  }
  .promo-expire {
    position: static;
  }
</style>
<article class='promo-detail'>
  <div class='promo-image'>
      <img src='./assets/pr-5.png' alt='Ưu đãi từ Haidilao' />

  </div>

  <div class='promo-content'>
    <h3 class='promo-title'>
      Ưu đãi từ Haidilao
    </h3>
    <p class='promo-expire'>Thời gian: 15/12/2025 – 15/02/2026</p>

    <div class='promo-desc'>
      <p>Thiên đường lẩu Trung Quốc với dịch vụ “đỉnh cấp”, chạm Thẻ VikkiONE Connect là ưu đãi bùng vị ngay.</p><ul><li>Giảm ngay 200.000&nbsp;VNĐ cho đơn từ 1.000.000&nbsp;VNĐ.</li><li>02 lần/thẻ/tuần.</li></ul>
    </div>

  </div>

</article>

  </body>
</html>
