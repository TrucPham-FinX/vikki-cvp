<script>
    const paramCards = new URLSearchParams(window.location.search);
    const hasCard = paramCards.get('hasCard');

    if (hasCard && hasCard === 'true') {
      body.classList.add('hasCard');
    }

  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const productSchemeParam = params.get("productScheme");
    let orgSchema = productSchemeParam ? productSchemeParam.toUpperCase() : 'HDBANK';

    function mapOrg(orgSchema) {
      if (!orgSchema) return null;
      if (orgSchema.includes("HDBANK")) return "hdbank";
      if (orgSchema.includes("VIKKI_BANK") || orgSchema.includes("VIKKI")) return "vikki";
      if (orgSchema.includes("SOVICO")) return "sovico";
      if (orgSchema.includes("DAMTC")) return "damtc";
      return null;
    }

    if (orgSchema) {
      document.querySelectorAll(".partner-item").forEach(item => {
        const id = item.getAttribute("data-id");
       
        if (id === mapOrg(orgSchema)) {
          
          item.classList.add("is-primary");
        } else {
          item.classList.remove("is-primary");
        }
      });
    }
  });

</script>

    }
  });

    const item = e.target.closest('.partner-item');
    if (!item) return;

    const paramCards = new URLSearchParams(window.location.search);
    const hasCard = paramCards.get('hasCard');
    const link = item.dataset.link;
    const id = item.dataset.id;
    
    if (window.ReactNativeWebView && (!hasCard || hasCard === 'false' ) && (id === 'hdbank' || id === 'sovico' || id === 'vikki' || id === 'vikkibank')) {
        window.ReactNativeWebView.postMessage(
        JSON.stringify({
            action: 'OPEN_CARD'
        })
        );
        return;
    }
  })

  <script>
      function initAccordion(root, options = {}) {
        const { multiple = false, defaultOpenIndex = null } = options;
  
        const items = root.querySelectorAll('.accordion-item');
  
        items.forEach((item, index) => {
          const header = item.querySelector('.accordion-header');
          const content = item.querySelector('.accordion-content');
  
          header.addEventListener('click', () => {
            const isActive = item.classList.contains('active');
  
            if (!multiple) {
              items.forEach((i) => {
                i.classList.remove('active');
                i.querySelector('.accordion-content').style.maxHeight = null;
              });
            }
  
            if (!isActive) {
              item.classList.add('active');
              content.style.maxHeight = content.scrollHeight + 'px';
            } else {
              item.classList.remove('active');
              content.style.maxHeight = null;
            }
          });
  
          if (defaultOpenIndex === index) {
            item.classList.add('active');
            content.style.maxHeight = content.scrollHeight + 'px';
          }
        });
      }
  
      function initAccordionsIn(root) {
        root.querySelectorAll('.js-accordion').forEach((acc) => {
          initAccordion(acc);
        });
      }
  
      initAccordionsIn(document);
    </script>
  
  <script>
      const popup = document.getElementById('popup');
      const popupBody = document.getElementById('popupBody');
      const closeBtn = document.getElementById('popupClose');
      const qaTemplate = document.getElementById('qaTemplate');
      const loading = document.getElementById('loading')
      const popupTitle = document.getElementById('popupTitle')
  
      document.querySelectorAll('[data-popup]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const type = btn.dataset.popup;
          const title = btn.dataset.title;
         
          openPopup(type, title);
        });
      });
  
      if(closeBtn){
        closeBtn.addEventListener('click', closePopup);
      }
      
  
      popup.addEventListener('click', (e) => {
        if (e.target === popup) closePopup();
      });
  
       function retryContent (type, iframe) {
          iframe.src = type;
          popupBody.appendChild(iframe);
         
          let timeout = setTimeout(() => {
            retryContent(type, iframe)
          }, 5000);
  
          iframe.onload = () => {
            loading.classList.remove('show');
            clearTimeout(timeout);
          };
      }
  
      function looksLikePdf(url) {
        return /\.pdf($|\?)/i.test(url);
      }
  
      // The page's ?lang (vi|en|ko, runtime/README.md) goes on with the CVP pages its popups open
      function withLang(url) {
        const lang = new URLSearchParams(window.location.search).get('lang');
        if (!lang || looksLikePdf(url)) return url;
        try {
          const target = new URL(url, window.location.href);
          if (target.origin !== window.location.origin || target.searchParams.has('lang')) return url;
          target.searchParams.set('lang', lang);
          return url.startsWith('/') ? target.pathname + target.search + target.hash : target.href;
        } catch (e) {
          return url;
        }
      }
  
      function openPopup(type, title) {
        popupBody.innerHTML = '';
        const isLink = type.startsWith('https://') || type.startsWith('/')
        const isPdfLink = looksLikePdf(type)
        if (isLink) type = withLang(type)
  
       // if(title){
           // popupTitle.textContent = title;
       // }
  
        if (!isLink) {
          popupBody.appendChild(qaTemplate.content.cloneNode(true));
          initAccordionsIn(popupBody);
          loading.classList.remove('show');
        } else {
          if(title){
            const titleEl = document.createElement('h2');
            titleEl.className = 'popup-title';
            titleEl.textContent = title;
            popupBody.appendChild(titleEl);
            popupBody.classList.add('pt-50')
          }
  
          const iframe = document.createElement('iframe');
          iframe.className = 'popup-iframe';
          if(isPdfLink){
            retryContent(type, iframe)
          } else {
            iframe.src = type;
            popupBody.appendChild(iframe);
           loading.classList.remove('show');
          }
          
        }
       
        popup.classList.add('show');
        document.body.style.overflow = 'hidden';
      }
  
      function closePopup() {
        loading.classList.add('show')
        popup.classList.remove('show');
        popupBody.innerHTML = '';
        document.body.style.overflow = '';
      }
    </script>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.4"></script>
  
  <script type="text/javascript">
      const body = document.getElementById('body');
      const videoContainer = document.getElementById('banner-container');
      const video = document.getElementById('banner-video');
      const volumeIcon = document.getElementById('volume-icon');
      const params = new URLSearchParams(window.location.search);
      const hasTopSpace = params.get('hasTopSpace');
  
      if (hasTopSpace === 'false') {
        // body.style.paddingTop = '0';
        body.classList.remove('hasTopSpace');
      }
      
      if(videoContainer){
        const videoSrc = './assets/video/playlist.m3u8';
        if (Hls.isSupported()) {
          var hls = new Hls();
          hls.loadSource(videoSrc);
          hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = videoSrc;
        } else {
          video.src = './assets/video.mp4';
        }
  
        video.addEventListener('loadedmetadata', () => {
          video.play().catch(() => {
            console.log('Autoplay blocked');
          });
        });
  
        // #video-container's height (see styles.hbs) is driven by --video-ar
        // instead of a hardcoded ratio, so it stays correct no matter which
        // video a given page loads.
        const videoBox = document.getElementById('video-container');
        const applyVideoRatio = () => {
          if (videoBox && video.videoWidth && video.videoHeight) {
            videoBox.style.setProperty('--video-ar', video.videoHeight / video.videoWidth);
          }
        };
        video.addEventListener('loadedmetadata', applyVideoRatio);
        applyVideoRatio();
  
  
        videoContainer.addEventListener('click', () => {
          video.muted = !video.muted;
          volumeIcon.classList.toggle('muted', video.muted);
          volumeIcon.classList.toggle('unmuted', !video.muted);
  
          if (!video.paused) return;
          video.play().catch(() => {});
        });
  
        const tryPlay = () => {
          video.play().catch((err) => console.warn('Replay blocked:', err));
          document.removeEventListener('touchstart', tryPlay);
        };
  
        tryPlay();
        document.addEventListener('touchstart', tryPlay);
      }
  
  </script>

  <script>
      function scrollToSection(target, options = {}) {
        const { offset = 0, behavior = 'smooth' } = options;
  
        const el =
          typeof target === 'string' ? document.querySelector(target) : target;
  
        if (!el) return;
  
        let finalOffset = offset;
  
        // ✅ check hasTopSpace → +25vw
        if (document.body.classList.contains('hasTopSpace')) {
          const vw25 = window.innerWidth * 0.25;
          finalOffset += vw25;
        }
  
        const top =
          el.getBoundingClientRect().top + window.pageYOffset - finalOffset;
  
        window.scrollTo({
          top,
          behavior,
        });
      }
  
      function initScrollToSection({ offset = 0 } = {}) {
        document.querySelectorAll('[data-scroll]').forEach((btn) => {
          btn.addEventListener('click', () => {
            scrollToSection(btn.dataset.scroll, { offset });
          });
        });
      }
  
      initScrollToSection({ offset: 48 });
    </script>
