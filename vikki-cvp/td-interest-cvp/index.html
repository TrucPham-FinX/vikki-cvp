      .tp-cvp img {

      .tp-cvp.container {

      .tp-cvp .interest-banner {

        padding: 8px 27px 0;
        border-radius: 10px;
        position: relative;
        z-index: 1;
      }

      .tp-cvp .calculator {
        background: linear-gradient(89.79deg, #f1c8e4 -3.95%, #ddddff 99.69%);

        border-radius: 17px;
        position: relative;
      }
      .tp-cvp .calculator h2 {

      }

      .tp-cvp .highlight-text {
        color: #f5a623;
      }

      .tp-cvp .form .form-item {
        display: flex;
        gap: 5px;
        margin-bottom: 17px;
      }

      .tp-cvp .form label {
        display: block;
        font-weight: bold;
        width: 100px;
        text-align: center;
        font-size: 0.875rem;
        color: #0000ff;
        align-self: center;
        line-height: 1.2;
      }

      .tp-cvp .form .form-input {

        top: 2px;
        bottom: 2px;
        right: 2px;
        border-radius: 10px;
      }

      .tp-cvp .form input,

        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: none;
        background: none;
        outline: none;
        font-size: 1.1875rem;
        position: relative;
        z-index: 2;
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        font-family: 'BeVietnam', sans-serif;
        padding: 0 50px 0 15px;
        line-height: 47px;
        margin: 0;
        color: #0000ff4d;
        font-weight: bold;
      }
      .tp-cvp .form select {

        z-index: 3;
        padding-right: 15px;
      }

        background: none !important;
        color: #0000ff4d !important;
        -webkit-background-clip: text;
        -webkit-box-shadow: 0 0 0 30px white inset !important;
        -webkit-text-fill-color: #0000ff4d;

    function DTemplateInterest(termSelect, key, idx) {
      const option = document.createElement('td');
      option.textContent = `${interest[key].value}%`;

      if (key === '180' || key === '390') {
        option.classList.add('highlight-cell');
      }
      termSelect.appendChild(option);
    }

    function MTemplateInterest(termSelect, key, idx) {
      const option = document.createElement('div');

      const inner = document.createElement('img');
      inner.src = `./assets/m-interest-${key}.png`;
      option.append(inner);

      const textInterest = document.createElement('span');
      textInterest.classList.add(`m-rate-number`);
      textInterest.classList.add(`m-rate-number-${key}`);
      const value = `${interest[key].value}`;
      textInterest.textContent = value;
      option.append(textInterest);

      termSelect.appendChild(option);
    }

    function DHightLightInterest(value, key) {
      const termSelect = document.getElementById(`rate-${key}`);
      termSelect.textContent = value;
    }

    function setInterestToPresent() {
      const termSelect = document.getElementById('d-interest');
      const mTermSelect = document.getElementById('m-interest');
      Object.keys(attractiveInterest).forEach((key, idx) => {
        DTemplateInterest(termSelect, key, idx);
        MTemplateInterest(mTermSelect, key, idx);
        if (key === 180 || key === 390) {
          DHightLightInterest(interest[key].value, idx);
        }
      });
    }

    function setTermOptionsFromArray(terms) {
      const termSelect = document.getElementById('term');
      termSelect.innerHTML = '';

      terms.forEach((term) => {
        const option = document.createElement('option');
        option.value = term.value;
        option.textContent = term.label;
        termSelect.appendChild(option);
      });
    }
    setTermOptionsFromArray(termOptions);

    //Caculate
    const amountInput = document.getElementById('amount');
    const termInput = document.getElementById('term');
    const interestInput = document.getElementById('interest');
    const interestResult = document.getElementById('interest-result');
    const totalResult = document.getElementById('princial-interest-result');

    function formatVND(number) {
      return number.toLocaleString('en-EN') + ' VND';
    }

    function calculateMaturityDate(item, effectiveDate) {
      let maturityDate;

      if (item?.tenor?.tenorUnit === TENOR_UNIT.MONTH) {
        const dayInMonthOfEffectiveDate = effectiveDate.daysInMonth();
        maturityDate = effectiveDate
          .clone()
          .add(item?.tenor?.tenorAmount, 'months');

        if (dayInMonthOfEffectiveDate === Number(effectiveDate.format('DD'))) {
          const dayInMonthOfMaturity = maturityDate.daysInMonth();
          maturityDate.set('dates', dayInMonthOfMaturity);
        }
      } else {
        maturityDate = effectiveDate
          .clone()
          .add(item?.tenor?.tenorAmount, 'weeks');
      }
      return maturityDate;
    }

    function calculateEffectiveDate(item) {
      let effectiveDate;
      if (item?.effectiveDate) {
        effectiveDate = moment(item?.effectiveDate);
      } else {
        effectiveDate = moment();
        const currentHour = effectiveDate.hour();
        if (currentHour >= CUT_OF_TIME_IN_HOURS) {
          effectiveDate = effectiveDate
            .clone()
            .add(1, 'day')
            .startOf('D')
            .add(CUT_OF_TIME_IN_HOURS, 'hours');
        }
      }
      return effectiveDate;
    }

    function estimateInterest(item) {
      const effectiveDate = calculateEffectiveDate(item);
      const maturityDate = calculateMaturityDate(item, effectiveDate);
      const dayDiffs = Math.abs(maturityDate.diff(effectiveDate, 'days'));

      const interestPerDay =
        (Number(item?.tenor?.rate) / 365) * Number(item?.amount);
      const roundUpTwoDecimal = Math.round(interestPerDay * 100) / 100;

      return Math.floor(roundUpTwoDecimal * dayDiffs);
    }

    function formatNumberWithCommas(value) {
      return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function unformatNumber(value) {
      return value.replace(/[^\d]/g, '');
    }

    function setInterest(e) {
      const interestObj = interest[e.target.value];
      const value = interestObj['value'];
      interestInput.value = value;
      calculate();
    }

    function calculate() {
      const rawValue = unformatNumber(amountInput.value);
      const principal = parseFloat(rawValue);
      const numberOfDays = termInput.value;
      const interestRate = interestInput.value;

      if (
        isNaN(principal) ||
        isNaN(numberOfDays) ||
        isNaN(interestRate) ||
        !interest[numberOfDays]
      ) {
        interestResult.textContent = '0';
        totalResult.textContent = '0';
        return;
      }

      const item = {
        effectiveDate: new Date(),
        tenor: {
          tenorUnit: interest[numberOfDays].tenorUnit,
          tenorAmount: interest[numberOfDays].tenorAmount,
          rate: interestRate / 100,
        },
        amount: principal,
      };

      const interestValue = estimateInterest(item);

      const total = principal + interestValue;

      interestResult.textContent = formatVND(interestValue);
      totalResult.textContent = formatVND(total);
    }

    amountInput.addEventListener('input', function (e) {
      const cursorPosition = this.selectionStart;
      const raw = unformatNumber(this.value);
      const formatted = formatNumberWithCommas(raw);
      this.value = formatted;

      calculate();
    });

    termInput.addEventListener('change', setInterest);
    interestInput.addEventListener('input', calculate);

    setInterestToPresent();
    calculate();
  </script>

      const height = document.body.scrollHeight;
      window.parent.postMessage({ type: 'setHeight', height }, '*');
    }

    window.addEventListener('load', sendHeightToParent);

    const resizeObserver = new ResizeObserver(sendHeightToParent);
    resizeObserver.observe(document.body);
  </script>
