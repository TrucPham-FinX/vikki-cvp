<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TD Campaign CVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        overflow-x: hidden;
      }

      body {
        font-family: "Be Vietnam Pro", Arial, Helvetica, sans-serif;
        background: linear-gradient(
          215deg,
          #0000ff 10%,
          #2929e4fe 19%,
          #1c00bb 24%,
          #5400bbf8 27%,
          #de0094 40%,
          #ff4488 45%,
          #a00d6fbc 50%,
          #3235d4d7 60%,
          #0c0ce2 80%,
          #3d3da5bd 90%,
          #ffb700e4 100%
        );
      }

      .section {
        max-width: 1176px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .hinhNen::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("assets/sanbonggray1.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.45;
        z-index: 0;
      }

      .hinhNen > * {
        position: relative;
        z-index: 1;
      }

      .banner {
        width: 100%;
      }
      .banner-btn {
        outline: none;
      }

      .banner-btn img.cta-img {
        width: 100%;
        height: auto;
      }

      .banner-btn-mobile {
        padding: 0;
        cursor: pointer;
        transition: transform 0.2s;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        margin-top: 14px;
        margin-left: -12px;
        display: none;
      }

      .banner-btn-mobile img.cta-img {
        width: 180px;
        height: auto;
      }

      .content-over-bg {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 0px;
      }

      .wrapper {
        margin: 0 auto;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .condition-title {
        text-align: center;
        color: #fff;
        padding: 16px 32px 8px;
        margin-top: 30px;
        font-weight: 100;
      }

      .condition-title h2 {
        font-size: 40px;
        font-weight: 700;
        margin-bottom: 10px;
        color: #fff;
        text-shadow:
          0 2px 0 #2336d9,
          0 0 10px rgba(255, 255, 255, 0.5);
      }

      .condition-title p {
        max-width: 1136px;
        margin: 16px auto 0;
        font-size: 17px;
        line-height: 1.3;
        color: #fff;
        text-align: left;
      }

      .condition-title p strong {
        font-weight: 700;
        color: #fff;
      }

      .info-section {
        margin: 40px auto 80px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .schedule-box {
        overflow: hidden;
        background: linear-gradient(180deg, #ffee96 0%, #ffdc44 100%);
        box-shadow:
          0 12px 40px rgba(248, 248, 248, 0.162),
          0 4px 12px rgba(187, 184, 184, 0.676);
        display: flex;
        flex-direction: column;
        border: 2px solid white;
      }

      .schedule-box p {
        margin: 0;
        padding: 9px 40px;
        color: #3030d8;
        font-size: 17px;
        line-height: 1.4;
        border-bottom: 1px solid white;
        background: rgba(255, 255, 255, 0.35);
        font-weight: normal;
      }

      .schedule-box p span {
        display: block;
        max-width: 90%;
      }

      .schedule-box p:nth-child(even) {
        background: transparent;
      }

      .schedule-box p strong {
        color: #3030d8;
      }

      .faq {
        display: flex;
        flex-direction: column;
        border: 0px solid rgba(255, 255, 255, 0.96);
        overflow: hidden;
        box-shadow:
          0 12px 40px rgba(255, 255, 255, 0.078),
          0 4px 12px rgba(246, 242, 242, 0.24);
      }

      .faq-item {
        overflow: hidden;
        background: linear-gradient(90deg, #0100fe, #c32296);
        border: 1px solid white;
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: inset 0px 2px 32px 0px #ffffff;
      }

      .faq-item:last-child {
        border-bottom: none;
      }

      .faq-item summary {
        list-style: none;
        cursor: pointer;
        padding: 16px 20px;
        color: #fff;
        font-weight: bold;
        position: relative;
        user-select: none;
      }

      .faq-item summary::-webkit-details-marker {
        display: none;
      }

      .faq-item summary::after {
        content: "";
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        width: 28px;
        height: 28px;
        background-image: url("./assets/Subtract.png");
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        transition: all 0.3s ease;
      }

      .faq-item[open] summary::after {
        background-image: url("./assets/down.png");
        transform: translateY(-50%);
      }

      .faq-content {
        background: #f9f9f9d3;
        color: #2336d9;
        padding: 10px 20px;
        line-height: 1.4;
        font-size: 15px;
        font-weight: normal;
        animation: faqSlideDown 0.3s ease-out;
      }
      .faq-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        font-size: 13px;
        font-weight: 500;
      }

      .faq-table th,
      .faq-table td {
        border: 1px solid #2336d9;
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }

      .faq-table th {
        background: rgba(35, 54, 217, 0.15);
        color: #2336d9;
        font-weight: 700;
        font-size: 12px;
      }

      .faq-table td {
        background: rgba(255, 255, 255, 0.6);
      }
      .desktop-img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
      }

      .desktop-img {
        /* max-width: 1100px; */
        margin: 0 auto;
      }

      .mobile-img {
        display: none;
        width: 100%;
        height: auto;
      }

      .banner .desktop-img,
      .banner .mobile-img {
        border-radius: 0;
        max-width: 100%;
      }

      .full-bleed {
        margin: 0 -20px;
        width: calc(100% + 40px);
      }

      .full-bleed .desktop-img,
      .full-bleed .mobile-img {
        border-radius: 0;
        max-width: 100%;
      }

      /* Utility */
      .pos-relative {
        position: relative;
      }
      .mt-20 {
        margin-top: 20px;
      }
      .mt-1rem {
        margin-top: 1rem;
      }
      .mt-2rem {
        margin-top: 2rem;
      }
      .img-center-200 {
        max-width: 200px;
        align-items: center;
        margin: 0 auto;
      }
      .text-justify {
        text-align: justify;
      }
      .btn-bottom-left {
        position: absolute;
        left: 20px;
        bottom: -37px;
        width: 24%;
      }

      /* Image-specific */
      .mb3-img {
        padding-top: 16px;
        padding-left: 16px;
      }

      .mb12-img {
        max-width: 350px;
        align-items: center;
        margin: 0 auto;
        padding: 8px 12px;
      }
      .the-le-mobile-img {
        max-width: 350px;
        align-items: center;
        margin: 0 auto;
        padding: 8px 12px;
      }
      .faq-mobile-img {
        max-width: 500px;
        align-items: center;
        margin: 0 auto;
        padding: 8px 12px;
      }
      .hinh15-positioned {
        padding: 0 40px;
        position: absolute;
        top: 0;
        left: 0;
        max-width: none;
        max-height: 100%;
      }
      .hinh6-img {
        margin-top: -10px;
        margin-bottom: 20px;
      }
      .hinh7-img {
        padding: 20px 0;
      }
      .hinh9-img {
        max-width: 700px;
        margin: 30px auto;
      }
      .hinh10-img {
        max-width: 300px;
        margin: -25px auto auto;
      }
      .hinh11-img {
        max-width: 300px;
        margin: -25px auto;
      }
      .hinh12-img {
        max-width: 600px;
        margin: auto;
      }
      .intro-images {
        display: flex;
        width: 100%;
        align-items: flex-start;
        gap: 16px;
      }

      .intro-images img {
        width: 50%;
        height: auto;
        display: block;
      }

      @keyframes faqSlideDown {
        from {
          opacity: 0;
          max-height: 0;
          padding-top: 0;
          padding-bottom: 0;
        }
        to {
          opacity: 1;
          max-height: 500px;
          padding-top: 18px;
          padding-bottom: 18px;
        }
      }

      .desktop-only {
        display: flex;
      }
      .mobile-only {
        display: none;
      }
      @media (min-width: 768px) {
        .hinhNen {
          padding-top: 50px;
        }
        .mt-30 {
          margin-top: 30px;
        }
      }

      /* Mobile */
      @media (max-width: 767px) {
        body {
          background: linear-gradient(
            180deg,
            #0a33d6 3%,
            #aa00ff 10%,
            #cc00ff 11%,
            #ff00a0 15%,
            #cc00ff 16%,
            #0a33d6 28%,
            #ffa202 30%,
            #ff00a0 32%,
            #aa00ff 33%,
            #0a33d6 38%,
            #aa00ff 48%,
            #de0094 52%,
            #aa00ff 53%,
            #0a33d6 88%,
            #ffae23 95%,
            #ff00a0 95.5%,
            #0a33d6 100%
          );
          background-attachment: scroll;
        }

        .banner {
          margin: 0 -12px;
          width: calc(100% + 24px);
        }

        .full-bleed {
          margin: 0 -12px;
          width: calc(100% + 24px);
        }

        .hinhNen::before {
          background-position: top;
          background-size: contain;
        }

        .hinhNen .section {
          padding: 0;
        }

        .content-over-bg {
          padding: 0 !important;
          gap: 16px;
        }

        .desktop-img {
          display: none;
        }

        .mobile-img {
          display: block;
        }

        .wrapper {
          gap: 12px;
        }

        .section {
          gap: 8px;
          padding: 0;
        }

        .banner {
          line-height: 0;
        }

        .condition-title {
          padding-left: 16px;
          padding-right: 16px;
        }

        .info-section {
          padding-left: 16px;
          padding-right: 16px;
          max-width: 100%;
          gap: 16px;
        }

        .schedule-box {
          gap: 1px;
        }

        .schedule-box p {
          padding: 12px 20px;
          font-size: 15px;
        }

        /* .faq {
          gap: 8px;
        } */

        .faq-item summary {
          padding: 14px 16px;
          padding-right: 50px;
          font-size: 14px;
        }

        .faq-item summary::after {
          right: 14px;
          width: 24px;
          height: 24px;
        }

        .faq-content {
          padding: 14px 16px;
          font-size: 13px;
        }
        .mb14-full {
          padding-right: 16px;
        }

        .mobile-only {
          display: flex;
          max-width: 240px;
        }

        .desktop-only {
          display: none !important;
        }
      }
      .p-16 {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
    </style>
  </head>
