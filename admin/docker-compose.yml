# Local development database. Run the admin on the host with `npm run dev`.
name: vikki-cvp-admin
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-cvp_admin}
      POSTGRES_USER: ${DATABASE_USERNAME:-cvp_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    ports:
      - '127.0.0.1:${DATABASE_PORT:-54391}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      retries: 10

volumes:
  pgdata:
