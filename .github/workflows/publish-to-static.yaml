name: Publish to Static Delivery Repo (Stage A)

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'front-end/**'
      - 'core/**'
      - 'content-types/**'
      - 'cvp.config.json'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - uat
          - stg

jobs:
  publish:
    name: Build & Publish to Static Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CVP Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Schemas & Contracts
        run: npm run validate

      - name: Verify Roadmap Health
        run: node tools/verify-roadmap.js

      - name: Run Build
        run: npm run build

      - name: Check Manifest Integrity
        run: npm run manifest:verify

      - name: Dry-run Publish to Static Delivery
        run: node tools/publish-to-static.js --env=${{ github.event.inputs.target_env || 'dev' }} --dry-run
