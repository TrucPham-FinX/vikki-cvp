name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm run install:all

      - name: Validate schemas & blocks
        run: npm run validate

      - name: Generate inventory & registry
        run: npm run inventory

      - name: Check build parity
        run: npm run check
